        function calculateRunningBalances() {
            let running = 0;
            const balances = {};
            // chronological order for math
            transactions.forEach(tx => {
                running += tx.amount;
                balances[tx.date] = Math.round(running * 100) / 100;
            });
            return balances;
        }

        function renderTransactionsView() {
            const view = document.getElementById('app-view');
            const dateBalances = calculateRunningBalances();
            
            let filtered = transactions.filter(tx => {
                const matchesSearch = tx.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      tx.subtitle.toLowerCase().includes(searchQuery.toLowerCase());
                if (currentFilter === 'Money in') return matchesSearch && tx.amount > 0;
                if (currentFilter === 'Money out') return matchesSearch && tx.amount < 0;
                return matchesSearch;
            });

            // Group by date in reverse chronological order (newest date first, scrolling down to older)
            // To ensure correct visual grouping while maintaining order from recent to oldest:
            const dateGroups = {};
            filtered.forEach(tx => {
                if (!dateGroups[tx.date]) dateGroups[tx.date] = [];
                dateGroups[tx.date].push(tx);
            });

            // Sort dates in reverse chronological order
            const sortedDates = Object.keys(dateGroups).sort((a, b) => new Date(b) - new Date(a));

            let html = `
                <div class="p-3 bg-white border-b border-[#e5e5ea]">
                    <div class="flex items-center bg-[#e4e4e6] rounded-xl px-3 py-2 space-x-2">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input type="text" id="search-input" value="${searchQuery}" oninput="handleSearch(this.value)" placeholder="Search" class="bg-transparent border-none outline-none text-sm w-full text-black placeholder-gray-500">
                    </div>
                </div>

                <div class="flex space-x-2 px-3 py-2.5 bg-white border-b border-[#e5e5ea] overflow-x-auto">
                    <button onclick="setFilter('All')" class="px-5 py-1.5 rounded-full text-sm font-medium transition ${currentFilter === 'All' ? 'bg-black text-white' : 'bg-white text-black border border-gray-300'}">All</button>
                    <button onclick="setFilter('Money in')" class="px-5 py-1.5 rounded-full text-sm font-medium transition ${currentFilter === 'Money in' ? 'bg-black text-white' : 'bg-white text-black border border-gray-300'}">Money in</button>
                    <button onclick="setFilter('Money out')" class="px-5 py-1.5 rounded-full text-sm font-medium transition ${currentFilter === 'Money out' ? 'bg-black text-white' : 'bg-white text-black border border-gray-300'}">Money out</button>
                </div>

                <div class="flex-1 overflow-y-auto bg-white divide-y divide-[#f0f0f5]">
            `;

            if (sortedDates.length === 0) {
                html += `<div class="p-8 text-center text-gray-500 text-sm">No transactions found matching "${searchQuery}"</div>`;
            } else {
                sortedDates.forEach(date => {
                    let txs = dateGroups[date];
                    let bal = dateBalances[date] !== undefined ? dateBalances[date] : 0.00;
                    let balFormatted = (bal < 0 ? '-£' : '£') + Math.abs(bal).toFixed(2);
                    html += `
                        <div class="flex justify-between items-center px-4 py-2 bg-[#f8f8f8] text-xs text-gray-500 font-medium border-t border-b border-[#e5e5ea]">
                            <span>${date === '19 Oct 2026' ? 'Pending' : date}</span>
                            <span>${balFormatted}</span>
                        </div>
                    `;
                    txs.forEach(tx => {
                        let iconSymbol = '↑';
                        if (tx.icon === 'pound') iconSymbol = '£';
                        if (tx.icon === 'transfer') iconSymbol = '⇄';
                        if (tx.icon === 'eye') iconSymbol = '👁';
                        if (tx.icon === 'storage') iconSymbol = '📦';

                        html += `
                            <div class="flex items-center justify-between px-4 py-3.5 hover:bg-gray-50 transition cursor-pointer" onclick="showTxDetail()">
                                <div class="flex items-center space-x-3">
                                    <div class="w-9 h-9 rounded-full bg-[#f2f2f7] border border-gray-200 flex items-center justify-center text-sm font-semibold text-gray-700">
                                        ${iconSymbol}
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-sm font-medium text-black">${tx.title}</span>
                                        <span class="text-xs text-gray-400">${tx.subtitle}</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-sm font-semibold ${tx.amount > 0 ? 'text-[#00703c]' : 'text-black'}">
                                        ${tx.amount > 0 ? '+ ' : '- '}£ ${Math.abs(tx.amount).toFixed(2)}
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                });
            }

            html += `</div>`;
            view.innerHTML = html;
            
            if (searchQuery) {
                const input = document.getElementById('search-input');
                if (input) {
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length);
                }
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            renderTransactionsView();
        }

        function handleSearch(val) {
            searchQuery = val;
            renderTransactionsView();
        }

        function showTxDetail() {
            // Transactions allowed
        }

        function showErrorCode() {
            showAlert("Error code 234 please call HSBC to resolve");
        }

        function showAlert(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('flex');
            document.getElementById('custom-modal').classList.add('hidden');
        }

        window.onload = function() {
            switchScreen('dashboard');
        };
    </script>
</body>
</html>
